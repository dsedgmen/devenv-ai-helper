name: RPM

on:
  push:
    branches: [main, "release/**", "release-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpmbuild:
    name: Build RPM (${{ github.ref_name }})
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install build tools
        run: dnf install -y git rpm-build rpmdevtools python3

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version, build, and stage RPMs
        id: ver
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x ./scripts/rpm-version.sh
          eval "$(./scripts/rpm-version.sh --shell)"
          ./scripts/rpm-version.sh
          {
            echo "version=${VERSION}"
            echo "release=${RELEASE}"
            echo "channel=${CHANNEL}"
          } >> "$GITHUB_OUTPUT"

          mkdir -p ~/rpmbuild/SOURCES ~/rpmbuild/SPECS dist
          mkdir -p "/tmp/pack/devenv-ai-helper-${VERSION}"
          cp -a devenv-ai-helper agents.json.example README.md LICENSE \
            "/tmp/pack/devenv-ai-helper-${VERSION}/"
          tar -C /tmp/pack -czf ~/rpmbuild/SOURCES/devenv-ai-helper-${VERSION}.tar.gz \
            "devenv-ai-helper-${VERSION}"
          cp devenv-ai-helper.spec ~/rpmbuild/SPECS/

          # Satisfy BuildRequires and pass channel macros in the same step
          dnf install -y python3
          rpmbuild -ba ~/rpmbuild/SPECS/devenv-ai-helper.spec \
            --define "devenv_ai_ver ${VERSION}" \
            --define "devenv_ai_rel ${RELEASE}"
          cp -a ~/rpmbuild/RPMS/*/*.rpm ~/rpmbuild/SRPMS/*.rpm dist/
          echo "Built ${CHANNEL}: devenv-ai-helper-${VERSION}-${RELEASE}"
          ls -la dist/

      - name: Upload RPMs
        uses: actions/upload-artifact@v5
        with:
          name: devenv-ai-helper-${{ steps.ver.outputs.channel }}-${{ steps.ver.outputs.version }}-${{ github.run_number }}
          path: dist/*

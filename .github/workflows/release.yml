name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-rc.*"
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-rc.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build RPMs but skip creating GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build release RPMs
    runs-on: ubuntu-24.04
    container: fedora:latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release: ${{ steps.meta.outputs.release }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      # actions/checkout needs git in the container or it drops a tarball with no .git
      - name: Install tools
        run: dnf install -y git rpm-build rpmdevtools python3

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve, build, stage
        id: meta
        env:
          # Ensure tag/branch is visible even if .git is incomplete
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x ./scripts/rpm-version.sh
          eval "$(./scripts/rpm-version.sh --shell)"
          echo "channel=$CHANNEL version=$VERSION release=$RELEASE"
          case "$CHANNEL" in
            stable|rc) ;;
            *)
              echo "Tag/ref must resolve to stable or rc (got $CHANNEL)" >&2
              exit 1
              ;;
          esac
          {
            echo "version=$VERSION"
            echo "release=$RELEASE"
            echo "channel=$CHANNEL"
          } >> "$GITHUB_OUTPUT"

          mkdir -p ~/rpmbuild/SOURCES ~/rpmbuild/SPECS dist
          mkdir -p "/tmp/pack/vim-ai-helper-${VERSION}"
          cp -a vim-ai-helper agents.json.example README.md LICENSE \
            "/tmp/pack/vim-ai-helper-${VERSION}/"
          tar -C /tmp/pack -czf ~/rpmbuild/SOURCES/vim-ai-helper-${VERSION}.tar.gz \
            "vim-ai-helper-${VERSION}"

          # Bake Version/Release (same reason as COPR: no macros on later rebuilds)
          qmark='?'
          dist_suffix="%{${qmark}dist}"
          sed \
            -e "s/^Version:.*/Version:        ${VERSION}/" \
            -e "s/^Release:.*/Release:        ${RELEASE}${dist_suffix}/" \
            vim-ai-helper.spec > ~/rpmbuild/SPECS/vim-ai-helper.spec

          rpmbuild -ba ~/rpmbuild/SPECS/vim-ai-helper.spec
          cp -a ~/rpmbuild/RPMS/*/*.rpm ~/rpmbuild/SRPMS/*.rpm dist/

      - name: Upload dist
        uses: actions/upload-artifact@v5
        with:
          name: release-rpms
          path: dist/*

  github-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: ${{ !inputs.dry_run && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-rpms
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: vim-ai-helper ${{ needs.build.outputs.version }}
          prerelease: ${{ needs.build.outputs.channel != 'stable' }}
          body: |
            Channel: **${{ needs.build.outputs.channel }}**

            RPM: `vim-ai-helper-${{ needs.build.outputs.version }}-${{ needs.build.outputs.release }}`

            See [RELEASE.md](./RELEASE.md) for the version framework (`main` = beta; tags = stable/rc).
          files: dist/*

name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install bandit
      # vim-ai-helper is a single file, not a package directory
      - run: bandit -ll -ii -f txt vim-ai-helper

  pip-audit:
    name: Dependency audit (declared RPM deps)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Audit known PyPI equivalents of Fedora Requires
        run: |
          pip install pip-audit
          pip install openai ollama
          pip-audit || true

  shellcheck:
    name: ShellCheck (packaging helpers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: find . -name '*.sh' -print0 | xargs -0 -r shellcheck

  syntax:
    name: Python compile check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 -m py_compile vim-ai-helper
      - run: ./vim-ai-helper agents
      - run: ./vim-ai-helper route complete
